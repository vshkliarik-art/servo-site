<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrial AI Assistant - Invite</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f4f6fb; color: #101827; display: grid; place-items: center; padding: 24px; }
    .card { width: min(560px, 100%); background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 18px 55px rgba(16, 24, 39, .14); }
    .logo { width: 220px; max-width: 80%; display: block; margin-bottom: 28px; }
    h1 { font-size: 30px; line-height: 1.15; margin: 0 0 14px; }
    p { font-size: 18px; line-height: 1.45; margin: 0 0 16px; }
    .meta { background: #f3f6fb; border-radius: 16px; padding: 16px; margin: 22px 0; font-size: 15px; word-break: break-all; }
    .button { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; padding: 15px 22px; min-width: 220px; background: #2872f0; color: #fff; font-weight: 700; font-size: 17px; text-decoration: none; cursor: pointer; }
    .secondary { color: #536173; font-size: 14px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.png" alt="Industrial AI Assistant">
    <h1 id="title">Приглашение Industrial AI Assistant</h1>
    <p id="description">Проверяем ссылку приглашения.</p>
    <p id="access"></p>
    <div class="meta" id="inviteDetails">Проверяем ссылку...</div>
    <button class="button" id="openApp">Открыть в приложении</button>
    <p class="secondary" id="hint">Если приложение не открылось, установите Industrial AI Assistant и снова нажмите кнопку.</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const parts = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
    const isAccess = parts[0] === 'invite' && parts[1] === 'access';
    const isChat = parts[0] === 'invite' && !isAccess;
    const inviteId = isAccess ? (parts[2] || params.get('id') || '') : (parts[1] || params.get('id') || '');
    if (isAccess) {
      document.getElementById('title').textContent = 'Приглашение в систему';
      document.getElementById('description').textContent = 'Вас пригласили в Industrial AI Assistant как участника системы.';
      document.getElementById('access').innerHTML = '<strong>Это не приглашение в чат.</strong> Роль и права будут применены после принятия в приложении.';
    } else if (isChat) {
      document.getElementById('title').textContent = 'Приглашение в диагностический чат';
      document.getElementById('description').textContent = 'Вас пригласили в диагностический чат Industrial AI Assistant.';
      document.getElementById('access').innerHTML = '<strong>Доступ:</strong> только этот чат.';
    } else {
      document.getElementById('title').textContent = 'Страница не найдена';
      document.getElementById('description').textContent = 'Эта ссылка не похожа на приглашение Industrial AI Assistant.';
      document.getElementById('openApp').style.display = 'none';
      document.getElementById('inviteDetails').textContent = location.pathname;
    }
    const appParams = new URLSearchParams();
    if (token) appParams.set('token', token);
    if (isAccess) {
      appParams.set('invite_type', 'app_access');
      appParams.set('invite_scope', 'workspace_access');
    } else {
      appParams.set('invite_type', 'chat');
      appParams.set('invite_scope', 'chat_only');
    }
    const appLink = `axiom://invite${isAccess ? '/access' : ''}/${encodeURIComponent(inviteId)}${appParams.toString() ? '?' + appParams.toString() : ''}`;
    if (isChat || isAccess) document.getElementById('inviteDetails').textContent = inviteId ? `ID приглашения: ${inviteId}` : 'В ссылке нет ID приглашения.';
    document.getElementById('openApp').addEventListener('click', () => { location.href = appLink; });
  </script>
</body>
</html>
